<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; worker-src 'none'; manifest-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    >
    <meta name="color-scheme" content="light dark">
    <title>Zayn Activity</title>
    <link rel="stylesheet" href="/activity.css">
    <script src="/activity.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#activity-feed">跳到活动记录</a>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="identity">
          <span class="eyebrow">LARK DAEMON</span>
          <div class="title-row">
            <h1>Zayn 活动</h1>
            <span id="service-status" class="service-status" role="status" aria-live="polite">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="service-status-text">正在连接</span>
            </span>
          </div>
        </div>

        <div class="topbar-tools">
          <label class="search-box" for="activity-search">
            <span class="search-icon" aria-hidden="true"></span>
            <span class="visually-hidden">搜索活动</span>
            <input
              id="activity-search"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="搜索消息、回复或错误"
            >
          </label>
          <button id="privacy-toggle" class="quiet-button" type="button" aria-pressed="false">
            隐藏正文
          </button>
        </div>
      </div>
    </header>

    <div class="page-shell">
      <aside class="sidebar" aria-label="运行状态和筛选">
        <section class="now-panel" aria-labelledby="now-heading">
          <div class="panel-heading">
            <h2 id="now-heading">NOW</h2>
            <span id="last-updated" class="updated-at">等待数据</span>
          </div>

          <p id="current-state" class="current-state">正在读取活动</p>
          <dl class="service-facts">
            <div>
              <dt>订阅</dt>
              <dd id="subscriber-value">—</dd>
            </div>
            <div>
              <dt>队列</dt>
              <dd id="queue-value">—</dd>
            </div>
            <div>
              <dt>运行</dt>
              <dd id="uptime-value">—</dd>
            </div>
          </dl>
        </section>

        <section class="today-panel" aria-labelledby="today-heading">
          <h2 id="today-heading">今天</h2>
          <div class="metric-grid">
            <button class="metric" type="button" data-filter-target="all">
              <strong id="received-count">—</strong>
              <span>收到</span>
            </button>
            <button class="metric" type="button" data-filter-target="replied">
              <strong id="sent-count">—</strong>
              <span>回复</span>
            </button>
            <button class="metric" type="button" data-filter-target="silent">
              <strong id="silent-count">—</strong>
              <span>静默</span>
            </button>
            <button class="metric" type="button" data-filter-target="attention">
              <strong id="attention-count">—</strong>
              <span>需处理</span>
            </button>
          </div>
        </section>

        <nav class="filter-panel" aria-label="活动筛选">
          <h2>显示</h2>
          <div id="filters" class="filter-list">
            <button type="button" data-filter="all" aria-pressed="true">全部</button>
            <button type="button" data-filter="attention" aria-pressed="false">需要处理</button>
            <button type="button" data-filter="replied" aria-pressed="false">已回复</button>
            <button type="button" data-filter="silent" aria-pressed="false">静默</button>
            <button type="button" data-filter="system" aria-pressed="false">系统</button>
          </div>
        </nav>
      </aside>

      <main id="activity-feed" class="activity-feed" tabindex="-1">
        <div id="connection-notice" class="connection-notice" role="alert" hidden></div>

        <section id="attention-section" class="feed-section attention-section" hidden>
          <div class="section-heading">
            <h2>需要处理</h2>
            <span id="attention-badge" class="count-badge">0</span>
          </div>
          <div id="attention-list" class="story-list"></div>
        </section>

        <section id="active-section" class="feed-section active-section" hidden>
          <div class="section-heading">
            <h2>进行中</h2>
            <span id="active-badge" class="count-badge">0</span>
          </div>
          <div id="active-list" class="story-list"></div>
        </section>

        <section id="today-section" class="feed-section">
          <div class="section-heading">
            <h2>今天</h2>
            <span id="today-badge" class="section-meta"></span>
          </div>
          <div id="today-list" class="story-list"></div>
        </section>

        <div id="recent-days"></div>

        <details id="older-section" class="fold-section" hidden>
          <summary>
            <span>更早</span>
            <span id="older-summary" class="section-meta"></span>
          </summary>
          <div id="older-list" class="story-list"></div>
        </details>

        <details id="low-signal-section" class="fold-section low-signal-section" hidden>
          <summary>
            <span>系统与已忽略</span>
            <span id="low-signal-summary" class="section-meta"></span>
          </summary>
          <div id="low-signal-list" class="story-list"></div>
        </details>

        <div id="empty-state" class="empty-state" aria-live="polite">
          <span class="empty-mark" aria-hidden="true"></span>
          <h2>正在读取活动</h2>
          <p>消息、判断和发送结果会显示在这里。</p>
        </div>

        <div class="pagination">
          <button id="load-older" class="load-older" type="button" hidden>加载更早</button>
        </div>
      </main>
    </div>
  </body>
</html>
