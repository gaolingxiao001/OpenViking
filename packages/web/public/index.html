<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; worker-src 'none'; manifest-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    >
    <meta name="color-scheme" content="light dark">
    <title>Agent Activity</title>
    <link rel="stylesheet" href="/activity.css">
    <script src="/activity.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <select id="instance-select" aria-label="选择 Agent" disabled>
        <option>正在读取</option>
      </select>
      <div class="session-picker" role="group" aria-label="选择会话">
        <button id="session-prev" type="button" title="更早的会话 ([)" disabled>‹</button>
        <select id="session-select" aria-label="选择会话" disabled>
          <option>正在读取</option>
        </select>
        <button id="session-next" type="button" title="更新的会话 (])" disabled>›</button>
      </div>
      <span id="live" class="live" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="live-text">正在连接</span>
      </span>
      <button id="privacy-toggle" class="quiet" type="button" aria-pressed="false" title="模糊正文 (P)">隐藏正文</button>
    </header>

    <section id="strip" class="strip" aria-label="时间带：每段为一轮，点击跳转">
      <div class="strip-labels" aria-hidden="true">
        <span class="lb-in">收</span><span>回合</span><span class="lb-out">回</span>
      </div>
      <div class="strip-main">
        <div id="strip-track" class="strip-track"></div>
        <div id="strip-axis" class="strip-axis"></div>
      </div>
    </section>

    <div class="split">
      <main id="feed" class="feed" aria-label="上下文">
        <button id="load-older" class="quiet older" type="button" hidden>加载更早</button>
        <div id="entries"></div>
        <p id="empty" class="empty">正在读取活动…</p>
      </main>
      <aside class="side" aria-label="运行状态与系统事件">
        <h2>运行状态</h2>
        <dl id="stats" class="stats"></dl>
        <h2>系统事件</h2>
        <ol id="system" class="system"></ol>
      </aside>
    </div>

    <button id="follow-live" class="follow" type="button" hidden>↓ 最新</button>
    <div id="notice" class="notice" role="alert" hidden></div>
  </body>
</html>
